document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

49,246,.88);padding:6px 10px;border-radius:6px;pointer-events:none}\n#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}\n.lbl{position:absolute;left:0;top:0;font-size:11.5px;background:rgba(255,255,255,.93);border:1px solid #cfc9bd;padding:3px 7px;border-radius:5px;white-space:nowrap;color:#2c2a25}\n#tip{position:absolute;pointer-events:none;background:#26241f;color:#fff;font-size:12px;line-height:1.35;padding:6px 9px;border-radius:6px;display:none;max-width:260px}\n.panel{overflow:auto;border-left:1px solid #dcd8cf;background:#faf9f6;padding:18px 18px 28px;display:flex;flex-direction:column;gap:20px}\nh1{font-size:17px;margin:0;font-weight:600}\n.sub{font-size:12.5px;color:#6d685e;margin-top:5px;line-height:1.45;text-wrap:pretty}\nh2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#7c766a;margin:0 0 8px;font-weight:600}\n.seg{display:flex;gap:3px;background:#ece9e2;padding:3px;border-radius:8px}\n.seg button{flex:1;border:0;background:transparent;padding:8px 3px;font:inherit;font-size:12.5px;border-radius:6px;cursor:pointer;color:#4a463e;white-space:nowrap}\n.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12);color:#1d1b17;font-weight:600}\n.gap{height:8px}\n.row{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;padding:5px 0;cursor:pointer;line-height:1.3}\n.row input{accent-color:#6b5a3a;width:16px;height:16px;margin:1px 0 0;flex:none}\n.num{font-variant-numeric:tabular-nums;color:#9a9486;width:18px;font-size:12px;flex:none;padding-top:1px}\n.desc{display:block;font-size:11.5px;color:#8a8478;margin-top:2px}\n.expl{font-size:12px;color:#6d685e;line-height:1.45;margin-top:8px;text-wrap:pretty}\n.dis{opacity:.4;pointer-events:none}\n.cams{display:grid;grid-template-columns:1fr 1fr;gap:6px}\n.cams button{border:1px solid #d9d5cc;background:#fff;border-radius:7px;padding:8px;font:inherit;font-size:13px;cursor:pointer;color:#3a362f}\n.cams button:hover{border-color:#a89c84}\n.sw{display:flex;gap:10px}\n.sw button{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;cursor:pointer;font:inherit;font-size:11.5px;color:#5f5a50;padding:0}\n.sw i{display:block;width:40px;height:40px;border-radius:8px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}\n.sw button.on i{border-color:#26241f}\n.cp{display:flex;gap:14px;margin-top:10px;font-size:12.5px;color:#5f5a50}\n.cp label{display:flex;align-items:center;gap:6px}\n.cp input{width:34px;height:26px;border:1px solid #d9d5cc;border-radius:5px;padding:1px;background:#fff}\n.sl{display:flex;align-items:center;gap:10px;font-size:13px}\n.sl input{flex:1;accent-color:#6b5a3a}\n.sl output{font-variant-numeric:tabular-nums;width:48px;text-align:right;color:#4a463e}\n.stats{font-size:13px;line-height:1.7;background:#f0ede6;border-radius:8px;padding:10px 12px}\n.stats b{font-weight:600;font-variant-numeric:tabular-nums}\n.ci{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px solid #ebe8e1}\n.ci span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;color:#4a463e}\n.ci.tot{font-weight:600;border-bottom:0;padding-top:8px}\n.note{font-size:12px;color:#7c766a;line-height:1.45;text-wrap:pretty}\n@media (max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}.panel{border-left:0;border-top:1px solid #dcd8cf}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"app\">\n  \n  <div class=\"viewer\">\n    <three-d-stage name=\"chateau_frontage\"><\u002Fthree-d-stage>\n    <div id=\"labels\"><\u002Fdiv><div id=\"tip\"><\u002Fdiv>\n    <div class=\"hint\">Hover anything for plant &amp; material names<\u002Fdiv>\n  <\u002Fdiv>\n  <aside class=\"panel\">\n    <div>\n      <h1>Front Landscape Planner<\u002Fh1>\n      <div class=\"sub\">Concepts for making a shallow front yard feel grander. Compare with today's layout, switch planting styles and wall options.<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <h2>View<\u002Fh2>\n      <div class=\"seg\" id=\"mode\"><\u002Fdiv>\n      <div class=\"gap\"><\u002Fdiv>\n      <div class=\"seg\" id=\"light\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <h2>Camera<\u002Fh2>\n      <div class=\"cams\" id=\"cams\">\n        <button data-c=\"street\">From street<\u002Fbutton>\n        <button data-c=\"sidewalk\">From sidewalk<\u002Fbutton>\n        <button data-c=\"corner\">Right corner<\u002Fbutton>\n        <button data-c=\"plan\">Top-down plan<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"aft\">\n      <h2>Planting style<\u002Fh2>\n      <div class=\"seg\" id=\"style\"><\u002Fdiv>\n      <div class=\"expl\" id=\"styleDesc\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"aft\">\n      <h2>Raised wall<\u002Fh2>\n      <div class=\"seg\" id=\"wall\"><\u002Fdiv>\n      <div class=\"expl\" id=\"wallDesc\"><\u002Fdiv>\n      <label class=\"row\" style=\"margin-top:6px\"><input type=\"checkbox\" id=\"blackBox\"><span>Black railing flower boxes<\u002Fspan><\u002Flabel>\n    <\u002Fdiv>\n    <div class=\"aft\">\n      <h2>Ideas<\u002Fh2>\n      <div id=\"ideas\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"aft\">\n      <h2>Driveway<\u002Fh2>\n      <div class=\"sl\"><span>Extend left<\u002Fspan><input id=\"ext\" type=\"range\" min=\"0\" max=\"4\" step=\"0.5\"><output id=\"extOut\"><\u002Foutput><\u002Fdiv>\n      <label class=\"row\" style=\"margin-top:6px\"><input type=\"checkbox\" id=\"blvd\"><span>Interlock between sidewalk and curb<span class=\"desc\">City approved<\u002Fspan><\u002Fspan><\u002Flabel>\n      <div class=\"gap\"><\u002Fdiv>\n      <h2>Paver colour<\u002Fh2>\n      <div class=\"sw\" id=\"pav\"><\u002Fdiv>\n      <div class=\"cp\"><label>Custom <input type=\"color\" id=\"cf\"><\u002Flabel><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <h2>Scene<\u002Fh2>\n      <div class=\"sl\"><span>Sun angle<\u002Fspan><input id=\"sun\" type=\"range\" min=\"-180\" max=\"180\" step=\"5\"><output id=\"sunOut\"><\u002Foutput><\u002Fdiv>\n      <label class=\"row\" style=\"margin-top:6px\"><input type=\"checkbox\" id=\"meas\"><span>Measurement labels<\u002Fspan><\u002Flabel>\n      <label class=\"row\"><input type=\"checkbox\" id=\"lines\"><span>Property lines<\u002Fspan><\u002Flabel>\n      <label class=\"row\"><input type=\"checkbox\" id=\"neigh\"><span>Neighbouring houses<\u002Fspan><\u002Flabel>\n    <\u002Fdiv>\n    <div class=\"stats\" id=\"stats\"><\u002Fdiv>\n    <div id=\"cost\" hidden=\"\"><\u002Fdiv>\n    <div class=\"note\">Lot 40 ft wide at the sidewalk; porch railing 7 ft back from it. Ground falls ~0.5 ft across the driveway, then ~2 ft from the steps to the right lot line, and 1 ft from house to sidewalk.<\u002Fdiv>\n  <\u002Faside>\n<\u002Fdiv>\n<script src=\"b0bc38d3-5198-4679-afbe-f7d5f56444c8\"><\u002Fscript>\n<script type=\"module\">\nconst stage = document.querySelector('three-d-stage');\nconst { THREE } = await stage.ready;\nconst FT = 0.3048, DS = THREE.DoubleSide;\nconst K1 = 23, K2 = 43;\nconst DROP = 2;\nconst Hx = x => x < K1 ? -0.025*x : x < K2 ? -0.5125 - (DROP/(K2-K1))*(x-K1) : -0.5125 - (DROP/(K2-K1))*(K2-K1) - 0.025*(x-K2);\nconst H = (x, z) => Hx(x) - 0.052 * z;\nfunction clipX(poly, lo, hi){\n  const cut = (pts, k, keepLeft) => { const out = [];\n    for (let i=0;i<pts.length;i++){ const a = pts[i], b = pts[(i+1)%pts.length], ia = keepLeft ? a[0] <= k : a[0] >= k, ib = keepLeft ? b[0] <= k : b[0] >= k;\n      if (ia) out.push(a); if (ia !== ib){ const t = (k-a[0])/(b[0]-a[0]); out.push([k, a[1]+t*(b[1]-a[1])]); } } return out; };\n  let p = poly; if (lo > -Infinity) p = cut(p, lo, false); if (p.length && hi < Infinity) p = cut(p, hi, true); return p;\n}\nconst ren = stage._renderer;\nren.toneMapping = THREE.ACESFilmicToneMapping; ren.toneMappingExposure = 1.18; ren.shadowMap.type = THREE.PCFShadowMap;\n\nconst SKEY = 'chateau-planner-v3';\nconst DEF = { mode:'after', light:'overcast', style:'cottage', wall:'twotier', neigh:true, lines:true, meas:false, blackBox:true, blvd:true, ext:3, paver:'limestone', cf:'#c9c2b5', cb:'#5f5c58', sun:-35,\n  ideas:{ forecourt:1, herr:1, medal:0, flare:1, bands:1, steps:1, piers:1, urns:0, bed:1, accents:1, blvdGrass:1, hydro:1, lighting:1 } };\nlet st;\ntry { const s = JSON.parse(localStorage.getItem(SKEY) || '{}'); st = { ...DEF, ...s, ideas:{ ...DEF.ideas, ...(s.ideas||{}) } }; }\ncatch (e) { st = JSON.parse(JSON.stringify(DEF)); }\nif (!st.v3){ st.ext = 3; st.v3 = 1; }\nconst save = () => localStorage.setItem(SKEY, JSON.stringify(st));\n\n// ---------- textures ----------\nfunction rng(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nfunction tex(draw, rep, seed=1){\n  const c = document.createElement('canvas'); c.width = c.height = 512;\n  draw(c.getContext('2d'), rng(seed));\n  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;\n  t.repeat.set(1/rep, 1/rep); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;\n}\nconst wrap = (fn, x, y, m=14) => { for (const ox of [0, x < m ? 512 : x > 512-m ? -512 : null]) for (const oy of [0, y < m ? 512 : y > 512-m ? -512 : null]) if (ox !== null && oy !== null) fn(x+ox, y+oy); };\nfunction speckle(g, r, n, lo, hi, a=.35, sz=2){ for (let i=0;i<n;i++){ const s = lo + r()*(hi-lo) | 0; g.fillStyle = `rgba(${s},${s},${s},${a})`; g.fillRect(r()*512, r()*512, sz, sz); } }\nconst shadeC = (r, lo, hi, warm=0) => { const s = lo + r()*(hi-lo) | 0; return `rgb(${s},${s-warm},${s-warm*3})`; };\nconst U = 512/12;\nconst pav = draw => tex((g,r) => { g.fillStyle = '#7d7973'; g.fillRect(0,0,512,512); draw(g,r); speckle(g,r,9000,150,255,.25); }, 4, 7);\nconst herrTex = pav((g,r) => { const b = (x,y,w,h) => { g.fillStyle = shadeC(r,214,250,2); g.fillRect(x*U+1.5, y*U+1.5, w*U-3, h*U-3); };\n  for (let m=-5; m<=5; m++) for (let k=-18; k<=30; k++){ b(k+4*m, k, 2, 1); b(k+2+4*m, k-1, 1, 2); } });\nconst bondTex = pav((g,r) => { for (let y=0; y<12; y++) for (let x=-1; x<7; x++){ g.fillStyle = shadeC(r,214,250,2); g.fillRect((x*2+(y%2))*U+1.5, y*U+1.5, 2*U-3, U-3); } });\nconst ringTex = tex((g,r) => { g.fillStyle = '#7d7973'; g.fillRect(0,0,512,512); const step = 30;\n  g.fillStyle = '#ddd9d1'; g.beginPath(); g.arc(256,256,step*.9,0,Math.PI*2); g.fill();\n  for (let i=1; i*step < 256; i++){ const rad = i*step + step/2, n = Math.max(6, Math.round(2*Math.PI*rad/60)); g.lineWidth = step - 3;\n    for (let j=0; j<n; j++){ g.strokeStyle = shadeC(r,214,250,2); const a0 = j/n*Math.PI*2, a1 = (j+1)/n*Math.PI*2; g.beginPath(); g.arc(256,256,rad,a0+.012,a1-.012); g.stroke(); } }\n  speckle(g,r,9000,150,255,.25); }, 1, 5);\nringTex.repeat.set(1,1); ringTex.wrapS = ringTex.wrapT = THREE.ClampToEdgeWrapping;\nconst ashlarTex = tex((g,r) => { g.fillStyle = '#b7b1a6'; g.fillRect(0,0,512,512); let y = 0;\n  for (const rh of [64,43,85,64,43,85,64,64]){ let x = -r()*150; while (x < 512){ const w = 96 + r()*128, c = shadeC(r,218,248,3);\n    for (const ox of [0,512]){ g.fillStyle = c; g.fillRect(x+ox+2, y+2, w-4, rh-4); } x += w; } y += rh; }\n  speckle(g,r,14000,140,255,.22); }, 8, 21);\nconst rubbleTex = tex((g,r) => { g.fillStyle = '#6f6960'; g.fillRect(0,0,512,512); let y = 0;\n  for (const rh of [72,56,88,64,72,56,104]){ let x = -r()*120; while (x < 512){ const w = 70 + r()*150, c = shadeC(r,170,236,5);\n    for (const ox of [0,512]){ g.fillStyle = c; g.beginPath(); g.roundRect(x+ox+3, y+3, w-6, rh-6, 6); g.fill(); } x += w; } y += rh; }\n  speckle(g,r,16000,90,255,.25); }, 6, 33);\nconst brickTex = tex((g,r) => { g.fillStyle = '#e4e0d8'; g.fillRect(0,0,512,512); const bh = 512/18, bw = 512/6;\n  for (let y=0;y<18;y++) for (let x=-1;x<7;x++){ g.fillStyle = shadeC(r,200,242,4); g.fillRect(x*bw+(y%2)*bw/2+2, y*bh+2, bw-4, bh-4); }\n  speckle(g,r,12000,120,255,.2); }, 4, 13);\nconst stuccoTex = tex((g,r) => { g.fillStyle = '#efefef'; g.fillRect(0,0,512,512); speckle(g,r,30000,200,255,.35); speckle(g,r,3000,170,220,.15,4); }, 6, 17);\nconst shingleTex = tex((g,r) => { g.fillStyle = '#2b2c2f'; g.fillRect(0,0,512,512); const rh = 512/14, tw = 512/6;\n  for (let y=0;y<14;y++) for (let x=-1;x<7;x++){ g.fillStyle = shadeC(r,62,98,0); g.fillRect(x*tw+(y%2)*tw/2+1.5, y*rh, tw-3, rh-2.5); }\n  speckle(g,r,20000,40,150,.3); }, 6, 19);\nconst grassTex = tex((g,r) => { g.fillStyle = '#6a9a45'; g.fillRect(0,0,512,512);\n  for (let i=0;i<60;i++){ g.fillStyle = `rgba(${r()<.5?'40,70,25':'140,170,80'},.07)`; const x = r()*512, y = r()*512, rad = 20+r()*60; wrap((a,b) => { g.beginPath(); g.arc(a,b,rad,0,7); g.fill(); }, x, y, 80); }\n  const cols = ['#5a8a3a','#74a84d','#86b45a','#63953f','#97c068','#517f34','#7caa52'];\n  g.lineWidth = 1.3;\n  for (let i=0;i<22000;i++){ const x = r()*512, y = r()*512, l = 3+r()*6, a = -Math.PI/2 + (r()-.5)*1.2; g.strokeStyle = cols[r()*cols.length|0];\n    wrap((px,py) => { g.beginPath(); g.moveTo(px,py); g.lineTo(px+Math.cos(a)*l, py+Math.sin(a)*l); g.stroke(); }, x, y); } }, 5, 41);\nconst mulchTex = tex((g,r) => { g.fillStyle = '#3b291e'; g.fillRect(0,0,512,512);\n  for (let i=0;i<6000;i++){ const s = r(); g.fillStyle = s<.33 ? '#5a3d2a' : s<.66 ? '#4a3223' : '#6b4a33'; const x = r()*512, y = r()*512, w = 4+r()*9, h = 2+r()*3, a = r()*3;\n    wrap((px,py) => { g.save(); g.translate(px,py); g.rotate(a); g.fillRect(-w/2,-h/2,w,h); g.restore(); }, x, y); } }, 3, 43);\nconst pebbleTex = tex((g,r) => { g.fillStyle = '#6f6d68'; g.fillRect(0,0,512,512);\n  for (let i=0;i<2600;i++){ const x = r()*512, y = r()*512, rx = 4+r()*8, ry = 3+r()*6, c = shadeC(r,120,215,1), a = r()*3;\n    wrap((px,py) => { g.fillStyle = c; g.beginPath(); g.ellipse(px,py,rx,ry,a,0,7); g.fill(); }, x, y); } }, 3, 47);\nconst asphaltTex = tex((g,r) => { g.fillStyle = '#4a4b4e'; g.fillRect(0,0,512,512); speckle(g,r,40000,30,140,.45,1.5); speckle(g,r,3000,90,160,.12,6); }, 6, 53);\nconst concTex = (joint) => tex((g,r) > Math.sin(a*1.7+b*3.1+c*2.3)*.45 + Math.sin(a*4.3-b*2.9+c*5.1)*.33 + Math.sin(-a*9.1+b*7.7+c*8.3)*.22;\nfunction lump(geo, amp, freq, seed){\n  const p = geo.attributes.position;\n  for (let i=0;i<p.count;i++){ const x = p.getX(i), y = p.getY(i), z = p.getZ(i), a = x*freq+seed, b = y*freq+seed*.7, c = z*freq-seed*1.3;\n    p.setXYZ(i, x+amp*nz(a,b,c), y+amp*nz(b+3.1,c+1.7,a+.3), z+amp*nz(c+5.3,a+2.9,b+1.1)); }\n  geo.computeVertexNormals(); return worldUV(geo);\n}\nfunction bush(p, label, m, x, y, z, r, sy=1, amp=.16, freq=2.2, det=4){\n  const g = lump(new THREE.IcosahedronGeometry(r, det), amp*r, freq/r, x*1.31+z*.77);\n  const o = new THREE.Mesh(g, m); o.name = m.name; o.scale.y = sy; o.position.set(x, y, z); tag(o, label); p.add(shade(o)); return o;\n}\nfunction hedgeBox(p, label, m, x0,z0,x1,z1,w,h,y){\n  const dx=x1-x0, dz=z1-z0, len=Math.hypot(dx,dz)+w;\n  const g = lump(new THREE.BoxGeometry(len, h+.4, w, Math.ceil(len*2.5), Math.ceil(h*2.5)+1, Math.ceil(w*2.5)), .09, 1.8, x0+z0);\n  const o = new THREE.Mesh(g, m); o.name = m.name; o.position.set((x0+x1)/2, y+(h-.4)/2, (z0+z1)/2); o.rotation.y = -Math.atan2(dz,dx); tag(o, label); p.add(shade(o)); return o;\n}\nfunction coneP(p, label, m, x, y, z, r, h, amp=.22){\n  const g = lump(new THREE.ConeGeometry(r, h, 24, 14), amp, 1.3, x+z);\n  const o = new THREE.Mesh(g, m); o.name = m.name; o.position.set(x, y+h/2, z); tag(o, label); p.add(shade(o)); return o;\n}\n\n// ---------- plant library ----------\nconst LBL = {\n  box:\"Boxwood 'Green Velvet' — clipped, evergreen\", hedge:\"Boxwood hedge — Buxus 'Green Velvet', clipped to 16 in\",\n  hydW:\"Hydrangea 'Annabelle' — white blooms Jul–Sep\", hydB:\"Hydrangea 'Invincibelle Spirit' — blush pink\", hydT:\"Limelight hydrangea tree — lime-to-white panicles\",\n  lav:\"White lavender 'Edelweiss' — 18 in, fragrant\", cat:\"White catmint 'Snowflake' — long-blooming\", spirea:\"Spirea 'Little Princess' — 2 ft, salt-tolerant, pink in June\", ann:\"Annuals — white impatiens & begonias, pink/coral accents\", rose:\"Shrub rose 'Bonica' — repeat bloomer\",\n  grass:\"Karl Foerster feather reed grass — upright, 4 ft\", yew:\"Yew 'Hicksii' — clipped evergreen\", jun:\"Juniper 'Blue Chip' — low spreading\",\n  mugo:\"Dwarf mugo pine — slow, round\", cedar:\"Emerald cedar — Thuja 'Smaragd', 10–12 ft\", horn:\"Columnar hornbeam 'Frans Fontaine' — 25 ft, narrow\",\n  svc:\"Serviceberry — spring flowers, fall colour\", spruce:\"Dwarf Alberta spruce\", topi:\"Boxwood cone topiary\", std:\"Boxwood standard (lollipop topiary)\", spill:\"Seasonal urn planting — white annuals\", yel:\"Coreopsis 'Zagreb' & Stella d'Oro daylily — yellow, all summer\", daisy:\"Shasta daisy 'Becky' — white, 2.5 ft\", gold:\"Spirea 'Gold Mound' — golden foliage shrub, 2.5 ft\", trail:\"Trailing spillers — white & pink calibrachoa, sweet potato vine\", fox:\"Foxglove & delphinium spires — pink / white, 3–4 ft\"\n};\nlet UPL = [];\nconst PL = {\n  boxBall:(p,x,y,z,r=.85) => bush(p,LBL.box,mat.box,x,y+r*.75,z,r,.9,.12,2.5),\n  hydr:(p,x,y,z,r=.95,fm=mat.hflower,lab=LBL.hydW) => { if (r >= .9 && lab !== LBL.hydT) UPL.push([x,y,z,r,2.2]); bush(p,lab,mat.hleaf,x,y+r*.6,z,r,.75,.2,2);\n    const rr = rng((x*97+z*31)|0); for (let i=0;i<9;i++){ const a = rr()*Math.PI*2, e = .25+rr()*1.0, R = r*.82;\n      bush(p,lab,fm,x+Math.cos(a)*Math.cos(e)*R, y+r*.6+Math.sin(e)*R*.75, z+Math.sin(a)*Math.cos(e)*R, .3, .8, .25, 3, 1); } },\n  lav:(p,x,y,z) => { bush(p,LBL.lav,mat.lavLeaf,x,y+.35,z,.7,.55,.2,2.5,3); bush(p,LBL.lav,mat.lav,x,y+.75,z,.72,.42,.3,4,3); },\n  cat:(p,x,y,z) => bush(p,LBL.cat,mat.cat,x,y+.45,z,.8,.6,.28,3.5,3),\n  rose:(p,x,y,z) => { bush(p,LBL.rose,mat.roseLeaf,x,y+.7,z,.85,.85,.22,2.5); const rr = rng((x*53+z*17)|0);\n    for (let i=0;i<8;i++){ const a = rr()*Math.PI*2, e = .2+rr()*1.1; bush(p,LBL.rose,mat.rose,x+Math.cos(a)*Math.cos(e)*.78, y+.7+Math.sin(e)*.62, z+Math.sin(a)*Math.cos(e)*.78, .17, .9, .2, 3, 1); } },\n  grass:(p,x,y,z,s=1,lab=LBL.grass) => { const pts = [[.12,0],[.35,.9],[.55,2.4],[.72,3.5],[.62,4.1],[.3,4.45],[0,4.5]].map(([r,h]) => new THREE.Vector2(r*s,h*s));\n    const g = lump(new THREE.LatheGeometry(pts,20), .06*s, 2.5, x+z); const u = new THREE.LatheGeometry(pts,20).attributes.uv; g.setAttribute('uv', u);\n    const o = new THREE.Mesh(g, mat.grassPl); o.name = 'ornamental_grass'; o.position.set(x,y,z); tag(o, lab); p.add(shade(o)); },\n  yewMound:(p,x,y,z,r=1.1) => bush(p,LBL.yew,mat.yew,x,y+r*.6,z,r,.8,.14,2.2),\n  jun:(p,x,y,z,r=1.4) => bush(p,LBL.jun,mat.juniper,x,y+.2,z,r,.3,.28,3.2),\n  mugo:(p,x,y,z) => bush(p,LBL.mugo,mat.mugo,x,y+.7,z,1,.72,.3,3.2),\n  cedar:(p,x,y,z) => { UPL.push([x,y,z,1.45,11]); coneP(p,LBL.cedar,mat.ever,x,y-.2,z,1.45,11.5); },\n  horn:(p,x,y,z) => { UPL.push([x,y,z,1.5,9]); cyl(p,'hornbeam_trunk',mat.bark,x,y,z,.16,3,LBL.horn); bush(p,LBL.horn,mat.horn,x,y+6.8,z,1.5,2.7,.18,2.2); },\n  svc:(p,x,y,z) => { UPL.push([x,y,z,2,9.5]); for (const [dx,dz,t] of [[-.3,0,.12],[.3,.2,-.1],[0,-.3,.05]]){ const c = cyl(p,'serviceberry_stem',mat.bark,x+dx,y,z+dz,.1,6.5,LBL.svc); c.rotation.z = t; }\n    for (const [dx,dy,dz,r] of [[0,8.2,0,2.1],[-1.4,7.2,.5,1.5],[1.3,7.4,-.4,1.6]]) bush(p,LBL.svc,mat.svc,x+dx,y+dy,z+dz,r,.8,.22,2); },\n  hydTree:(p,x,y,z) => { UPL.push([x,y,z,1.3,5]); cyl(p,'hydrangea_tree_trunk',mat.bark,x,y,z,.12,3.4,LBL.hydT); PL.hydr(p,x,y+3.1,z,1.3,mat.lime,LBL.hydT); },\n  trail:(p,x,y,z,L,lab=LBL.trail) => { if (L < .25) return; bush(p,lab,mat.hleaf,x,y-L*.5+.15,z,.32,L/.64,.3,3,2); const rr = rng((x*41+z*23)|0);\n    for (let i=0;i<3;i++) bush(p,lab,rr()<.5 ? mat.pinkA : mat.hflower,x+(rr()-.5)*.4,y-rr()*L*.8,z+.22,.12,.9,.2,3,1); },\n  yel:(p,x,y,z,r=.6) => { bush(p,LBL.yel,mat.hleaf,x,y+r*.45,z,r,.6,.25,3,2); const rr = rng((x*61+z*19)|0);\n    for (let i=0;i<10;i++){ const a = rr()*Math.PI*2, e = .3+rr()*1.1; bush(p,LBL.yel,mat.yel,x+Math.cos(a)*Math.cos(e)*r*.9, y+r*.45+Math.sin(e)*r*.55, z+Math.sin(a)*Math.cos(e)*r*.9, .12, .8, .2, 3, 1); } },\n  daisy:( splay = st.meas ? '' : 'none';\n  $('cf').value = st.paver === 'custom' ? st.cf : hx(PAL[st.paver].f);\n  $('blvd').checked = st.blvd; $('lines').checked = st.lines; $('neigh').checked = st.neigh; $('blackBox').checked = st.blackBox;\n}\nfunction renderStats(s){\n  $('stats').innerHTML = s.after\n    ? `Driveway width at garage: <b>${s.width.toFixed(1)} ft<\u002Fb><br>Interlock on property: <b>≈ ${Math.round(s.propArea)} sq ft<\u002Fb>${s.blvdArea ? `<br>Interlock in boulevard: <b>≈ ${Math.round(s.blvdArea)} sq ft<\u002Fb>` : ''}`\n    : `Today: asphalt driveway <b>10.3 ft<\u002Fb> wide, precast steps, open lawn.`;\n  const k = n => '$' + (Math.round(n/100)*100).toLocaleString();\n  const lo = s.items.reduce((a,i) => a+i[1], 0), hi = s.items.reduce((a,i) => a+i[2], 0);\n  $('cost').innerHTML = s.after ? s.items.map(i => `<div class=\"ci\"><span>${i[0]}<\u002Fspan><span>${k(i[1])}–${k(i[2])}<\u002Fspan><\u002Fdiv>`).join('') + `<div class=\"ci tot\"><span>Total (rough)<\u002Fspan><span>${k(lo)}–${k(hi)}<\u002Fspan><\u002Fdiv>` : '<div class=\"note\">Switch to After to see an estimate.<\u002Fdiv>';\n}\nlet labs = [];\nfunction makeLabels(list){ $('labels').innerHTML = list.map(l => `<div class=\"lbl\">${l[0]}<\u002Fdiv>`).join(''); const els = [...$('labels').children]; labs = list.map((l,i) => ({ el:els[i], v:new THREE.Vector3(...l[1]).multiplyScalar(FT) })); }\nconst pv = new THREE.Vector3();\n(function tick(){ requestAnimationFrame(tick); if (!st.meas) return; const w = stage.clientWidth, h = stage.clientHeight;\n  for (const l of labs){ pv.copy(l.v).project(cam); const vis = pv.z < 1 && Math.abs(pv.x) < 1.1 && Math.abs(pv.y) < 1.1;\n    l.el.style.display = vis ? '' : 'none'; l.vis = vis; l.sx = (pv.x+1)/2*w; l.sy = (1-pv.y)/2*h; }\n  const placed = [];\n  for (const l of labs){ if (!l.vis) continue; const bw = l.el.offsetWidth, bh = l.el.offsetHeight + 4; let y = l.sy;\n    for (let n=0; n<8; n++){ const c = placed.find(p => Math.abs(p.x - l.sx) < (p.w + bw)/2 &&
